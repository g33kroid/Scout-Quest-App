name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    # Plain Postgres w/ pgtap baked in (the same image `supabase start` uses
    # under the hood) — no Supabase CLI/Docker orchestration required. Keeps
    # local dev (native Postgres, docs/runbook.md) and CI on the same schema
    # tooling: scripts/db-*.sh, plain psql/pg_prove.
    services:
      postgres:
        image: supabase/postgres:15.14.1.170
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install postgresql-client (psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # 1. lockfile respected
      - name: Install (npm ci)
        run: npm ci

      # 2. typecheck, lint, format check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

      # 3. unit tests
      - name: Unit tests
        run: npm run test

      # 4. migrations + pgTAP (empty suite passes)
      - name: DB migrate
        run: npm run db:migrate
      - name: pgTAP suite
        run: npm run db:test

      # public repo — no real data in tracked files
      - name: Real-data gate (UAE phone pattern)
        run: bash scripts/check-no-real-data.sh

      - name: Build
        run: npm run build

      # 5. Playwright E2E against the local build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      # 6. secret gate on the client bundle
      - name: Secret gate (client bundle)
        run: bash scripts/check-client-bundle-secrets.sh

      # 7. gitleaks on the diff
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. npm audit
      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
