name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    # Full `supabase start` stack (Postgres 17 + GoTrue + PostgREST + Kong +
    # Storage + Realtime), not just a bare Postgres service container — Task
    # 03's auth flows need real GoTrue (TOTP enrollment/challenge, session
    # minting), and the E2E suite exercises them for real. GH-hosted runners
    # have Docker preinstalled, same as local dev's colima-backed Docker
    # (docs/runbook.md). Migrations run automatically as part of
    # `supabase start` — no separate db:migrate step needed here.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Supabase's well-known local-dev defaults — deterministic output of
      # `supabase start` on every machine, not secrets. Same values as this
      # project's own .env.local (docs/runbook.md).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs event.before..event.after — needs real history,
          # not the default shallow (depth-1) clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install postgresql-client (psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # 1. lockfile respected
      - name: Install (npm ci)
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start Supabase (Postgres + Auth + PostgREST + Storage + Realtime)
        run: supabase start

      # 2. typecheck, lint, format check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

      # 3. unit tests
      - name: Unit tests
        run: npm run test

      # 4. pgTAP (migrations already applied by `supabase start` above)
      - name: pgTAP suite
        run: npm run db:test

      # public repo — no real data in tracked files
      - name: Real-data gate (UAE phone pattern)
        run: bash scripts/check-no-real-data.sh

      - name: Build
        run: npm run build

      # 5. Playwright E2E against the local build
      - name: Seed E2E fixtures
        run: npm run seed:e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      # 6. secret gate on the client bundle
      - name: Secret gate (client bundle)
        run: bash scripts/check-client-bundle-secrets.sh

      # 7. gitleaks on the diff
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. npm audit
      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
